# 构建脚本：push 后自动编译并输出 APK 制品
name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 构建调试版 APK
        id: build_debug
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-debug.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: 构建发布版 APK
        id: build_release
        continue-on-error: true
        if: steps.build_debug.outputs.exit_code == '0'
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee build-release.log

      - name: 归档构建日志到 ci-logs 分支
        if: always()
        run: |
          set -e
          mkdir -p /tmp/cilog
          [ -f build-debug.log ] && cp build-debug.log /tmp/cilog/ || echo "无调试日志" > /tmp/cilog/build-debug.log
          [ -f build-release.log ] && cp build-release.log /tmp/cilog/ || true
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan ci-logs
          git rm -rf --cached . -q || true
          rm -rf ./* || true
          cp /tmp/cilog/build-debug.log .
          [ -f /tmp/cilog/build-release.log ] && cp /tmp/cilog/build-release.log . || true
          git add -A
          git commit -m "CI 构建日志 ${{ github.run_number }}" || echo "无变化"
          git push -f origin ci-logs

      - name: 上传调试版 APK
        if: steps.build_debug.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: VioletToolBoxMobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: 上传发布版 APK
        if: steps.build_debug.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: VioletToolBoxMobile-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: 构建失败则中止
        if: steps.build_debug.outputs.exit_code != '0'
        run: |
          echo "构建失败，请查看 ci-logs 分支中的 build-debug.log"
          exit 1
